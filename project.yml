name: iMovie
options:
  bundleIdPrefix: local.imovie
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: zh-Hans
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.5.4"
    CURRENT_PROJECT_VERSION: "10"
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    exactVersion: "2.9.6"
targets:
  iMovie:
    type: application
    platform: iOS
    dependencies:
      - package: SwiftSoup
    sources:
      - path: Sources/App
      - path: Sources/Core
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Resources/media-observer.js
        buildPhase: resources
      - path: Resources/ThirdPartyNotices.txt
        buildPhase: resources
      - path: Resources/source-origins.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.imovie.player
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: "NO"
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: Resources/Info.plist
  iMovieUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UITests
    dependencies:
      - target: iMovie
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.imovie.uitests
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  iMovie:
    build:
      targets:
        iMovie: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - iMovieUITests
    archive:
      config: Release
