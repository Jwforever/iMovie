name: Build unsigned iOS app
"on":
  workflow_dispatch:
    inputs:
      runtime_only:
        description: Run plugin runtime regressions and live source diagnostics
        type: boolean
        default: false
      runner:
        description: macOS runner
        type: string
        default: macos-15
permissions:
  contents: read
jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew list xcodegen || brew install xcodegen
      - name: Probe additional source connectivity
        run: python3 scripts/probe_additional_sources.py
      - name: Test and build
        run: |
          if [ "${{ inputs.runtime_only }}" = "true" ]; then
            IMOVIE_SOURCE_DIAGNOSTICS=1 swift test
          else
            bash scripts/build-unsigned.sh
          fi
      - name: Unit test report
        if: always()
        run: git status --short
      - name: Upload unsigned IPA
        if: ${{ !inputs.runtime_only }}
        uses: actions/upload-artifact@v4
        with:
          name: iMovie-unsigned-ipa
          path: |
            dist/*.ipa
            dist/*.sha256
            dist/additional-source-probe.json
          if-no-files-found: error
          retention-days: 7
      - name: Simulator playback smoke tests
        if: ${{ !inputs.runtime_only }}
        run: bash scripts/test-simulator.sh
      - name: Upload simulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iMovie-simulator-evidence
          path: |
            dist/ui-evidence/
            build/SimulatorTests.xcresult/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload plugin diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-source-diagnostics
          path: dist/plugin-source-diagnostics.json
          if-no-files-found: ignore
