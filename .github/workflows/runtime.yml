name: Plugin runtime diagnostics
"on":
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Runtime regression and live source diagnostics
        run: swift test
        env:
          IMOVIE_SOURCE_DIAGNOSTICS: "1"
      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-source-diagnostics
          path: dist/plugin-source-diagnostics.json
